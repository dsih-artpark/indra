[project]
name = "indra"
version = "0.1.1"
description = ""
authors = [{ name = "Sai Sneha", email = "sneha@artpark.in" }]
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
    "typer>=0.15.2,<0.16",
    "requests>=2.28",
    "boto3",
    "cdsapi>=0.7.5,<0.8",
    "pandas>=2.2.3,<3",
    "netcdf4>=1.7.2,<2",
    "scipy>=1.15.2,<2",
    "geopandas>=1.0.1,<2",
    "pyyaml>=6.0.2,<7",
    "beautifulsoup4>=4.13.3,<5",
    "joblib>=1.4.2,<2",
    "python-dotenv>=1.0.1,<2",
    "playwright>=1.44.0,<2",
    "dask>=2026.1.2",
    "s3fs>=2024.0.0",
    "kerchunk",
    "ujson",
    "zarr<3",
    "xarray",
    "h5py",
    "h5netcdf",
]

[project.scripts]
indra = "indra.cli:app"

[dependency-groups]
dev = ["ipython>=9.0.2,<10"]
test = [
    "pytest>=8.3.5,<9",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=6.1.1,<7",
    "moto~=4.0",
]
docs = [
    "sphinx>=8.2.3,<9",
    "furo>=2024.8.6,<2025",
    "myst-parser>=4.0.1,<5",
    "sphinx-design>=0.6.1,<0.7",
    "linkify-it-py>=2.0.3,<3",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-autodoc2>=0.5.0,<0.6",
    "sphinx-togglebutton>=0.3.2,<0.4",
]

[tool.uv]
default-groups = [
    "dev",
    "test",
    "docs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "FLY", "RUF", "B", "ICN"]

[tool.ruff]
line-length = 140

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=indra --cov-report=term-missing"
filterwarnings = [
    "ignore:The NumPy module was reloaded:UserWarning",
    # Add other warning filters as needed
]
