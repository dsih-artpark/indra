shared_params:
  local_data_dir: "~/.dsih-data/"
  email_recipients:
    "User <user@example.com>"
  s3_bucket: 'example-bucket-name'

cds:
  cds_dataset_name: "reanalysis-era5-single-levels"
  bounds_nwse:
    ka: [19,74,11,79]  # Example bounds for Karnataka
  variables:
    "2m_temperature": "2t"
    "2m_dewpoint_temperature": "2d"
    "total_precipitation": "tp"
    "10m_u_component_of_wind": "10u"
    "10m_v_component_of_wind": "10v"
  start_date: None  # Will be set automatically if using --current-month
  end_date: None    # Will be set automatically if using --current-month
  ds_id: 'MW0016DS0046'
  ds_name: "ERA5_Reanalysis_Single_Level"
  folder_name: "all_india_netcdf"
  ds_source: "ECMWF CDS"
  extension: "nc"

ecpds:
  url: 'https://data.ecmwf.int/forecasts'
  zulu_utc_timestamp: '00z'
  resolution: '0p25'
  model: 'ifs'
  forecast_type: 'oper'
  forecast_times: ["0h", "6h"]
  raise_error: true
  chunk: true
  chunk_size: 1048576
  ds_id: 'MW0021DS0079'
  ds_name: 'ECPDS_Operational_Forecasts'
  folder_name: '00z_ifs_0p25_oper'
  ds_source: 'ECMWF ECPDS'
  extensions: ["grib2", "index"]

# ERA5 grid configuration (used by CoS module)
era5:
  resolution_deg: 0.1
  s3_prefix: "MW0016DS0046-ERA5_Reanalysis_Single_Level/all_india_netcdf"
  file_pattern: "era5_sfc_{variable}_{year}.nc"

# Region profiles — add a block per city/granularity
regions:
  bengaluru-zones:
    s3_key: "boundaries/GBA_zone_boundary_standardized.geojson"
    id_field: "id"            # Feature-level id e.g. "zone_gba-n-1"
    name_field: "regionName"  # e.g. "NORTH CORPORATION ZONE 1"
  bengaluru-wards:
    s3_key: "boundaries/GBA_ward_boundary_standardized.geojson"
    id_field: "id"
    name_field: "regionName"
  bengaluru-corporation:
    s3_key: "boundaries/GBA_corporation_boundary_standardized.geojson"
    id_field: "id"
    name_field: "regionName"

# IDW tuning parameters (used by CoS module)
cos:
  idw_power: 2
  search_radius_km: 25

